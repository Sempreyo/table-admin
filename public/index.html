<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="C3Solutions">
    <meta name="keywords" content="">
    <link href="css/main.min.css" rel="stylesheet" type="text/css">
    <title>Table-admin</title>
  </head>
  <body>
    <main class="main">
      <section class="table">
        <div class="container">
          <div class="table__sticky-menu">
            <div class="table__create">
              <label>Количество строк
                <input class="table__num-rows" type="number" min="1">
              </label>
              <label>Количество столбцов
                <input class="table__num-columns" type="number" min="1">
              </label>
              <button class="btn btn-primary btn-small js-create-table">Добавить</button>
            </div>
            <div class="table__panel" hidden>
              <div class="table__panel-group">
                <button class="btn btn-primary btn-small js-edit" data-edit="bold"><i class="icon-bold icon-white"></i></button>
                <button class="btn btn-primary btn-small js-edit" data-edit="italic"><i class="icon-italic icon-white"></i></button>
                <button class="btn btn-primary btn-small js-edit" data-edit="horizontal-left"><i class="icon-align-left icon-white"></i></button>
                <button class="btn btn-primary btn-small js-edit" data-edit="horizontal-center"><i class="icon-align-center icon-white"></i></button>
                <button class="btn btn-primary btn-small js-edit" data-edit="horizontal-right"><i class="icon-align-right icon-white"></i></button>
                <button class="btn btn-primary btn-small js-edit" data-edit="remove-edit"><i class="icon-remove icon-white"></i></button>
                <div class="table__button-with-dropdown">
                  <button class="btn btn-primary btn-small" data-dropdown="link"><span>Ссылка</span></button>
                  <form class="table__dropdown" hidden>
                    <input type="text" name="link-text" placeholder="Текст">
                    <input type="text" name="link" placeholder="Ссылка">
                    <label class="checkbox">
                      <input type="checkbox" name="link-target">
                      <p><i class="icon-ok"></i></p><span>В новом окне?</span>
                    </label>
                    <button class="btn btn-primary btn-small" type="submit">Добавить</button>
                  </form>
                </div>
                <div class="table__button-with-dropdown">
                  <button class="btn btn-primary btn-small" data-dropdown="color"><i class="icon-tint icon-white"></i><span>Цвет ячейки</span></button>
                  <form class="table__dropdown">
                    <input type="color" name="color" value="#ffffff"><span>Применить к</span>
                    <label class="radio">
                      <input type="radio" name="apply-to" value="cell" checked>
                      <p><i class="icon-ok"></i></p><span>Выделенной ячейке</span>
                    </label>
                    <label class="radio">
                      <input type="radio" name="apply-to" value="row">
                      <p><i class="icon-ok"></i></p><span>Строке</span>
                    </label>
                    <label class="radio">
                      <input type="radio" name="apply-to" value="column">
                      <p><i class="icon-ok"></i></p><span>Столбцу</span>
                    </label>
                    <button class="btn btn-primary btn-small" type="submit">Добавить</button>
                  </form>
                </div>
                <div class="table__button-with-dropdown">
                  <button class="btn btn-primary btn-small" data-dropdown="width"><i class="icon-resize-horizontal icon-white"></i><span>Ширина столбца</span></button>
                  <form class="table__dropdown">
                    <input type="text" name="width" placeholder="Ширина в px">
                    <button class="btn btn-primary btn-small" type="submit">Добавить</button>
                  </form>
                </div>
              </div>
              <div class="table__panel-group">
                <button class="btn btn-primary btn-small js-create-row"><i class="icon-plus-sign icon-white"></i><span>Строка</span></button>
                <button class="btn btn-primary btn-small js-create-column"><i class="icon-plus-sign icon-white"></i><span>Столбец</span></button>
              </div>
              <div class="table__panel-group">
                <button class="btn btn-primary btn-small js-remove-row"><i class="icon-trash icon-white"></i><span>Удалить строку</span></button>
                <button class="btn btn-primary btn-small js-remove-column"><i class="icon-trash icon-white"></i><span>Удалить столбец</span></button>
              </div>
              <div class="table__panel-group">
                <button class="btn btn-primary btn-small js-join-cells"><i class="icon-resize-small icon-white"></i><span>Объединить</span></button>
                <button class="btn btn-primary btn-small js-split-cells"><i class="icon-resize-full icon-white"></i><span>Разделить</span></button>
              </div>
              <div class="table__panel-group">
                <label class="btn btn-primary btn-small"><i class="icon-upload icon-white"></i><span>Импорт</span>
                  <input class="js-import" type="file" accept=".csv,.xlsx,.xls"><span class="error-msg" hidden></span>
                </label>
                <button class="btn btn-primary btn-small js-export"><i class="icon-download icon-white"></i><span>Экспорт</span></button>
              </div>
            </div>
          </div>
          <div class="table__wrapper"></div>
        </div>
      </section>
    </main>
  </body>
  <script src="js/main.min.js"></script>
</html>
